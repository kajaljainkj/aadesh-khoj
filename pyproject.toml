[project]
name = "aadesh-khoj"
version = "0.1.0"
description = "Multilingual RAG over Hindi government orders, including legacy Kruti Dev and scanned PDFs"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "gradio>=4.40",
    "openai>=1.40",
    "sentence-transformers>=3.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "numpy>=1.26",
    "pymupdf>=1.24",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]
# only needed to regenerate data/samples (already committed): playwright, fonttools

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
