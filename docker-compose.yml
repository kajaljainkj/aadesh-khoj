services:
  db:
    image: pgvector/pgvector:pg16
    container_name: aadesh_pg
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "55432:5432"   # uncommon host port, so it never clashes with a locally installed Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
